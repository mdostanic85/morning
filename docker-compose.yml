services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: worklight-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: worklight
      POSTGRES_PASSWORD: worklight
      POSTGRES_DB: worklight
    volumes:
      - worklight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklight -d worklight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  worklight_postgres_data:
